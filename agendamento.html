<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - LauraTerapia</title>
    <link rel="stylesheet" href="css/agendamento.css">
</head>

<body>

<header>
    <h1>LauraTerapia</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="tratamentos.html">Tratamentos</a>
        <a href="profissionais.html">Profissionais</a>
        <a href="agendamento.html">Agendamento</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>

<main>

    <h2>Agende sua consulta</h2>

    <form onsubmit="agendar(event)">

        <label>Nome:</label>
        <input type="text" id="nome" required>

        <label>E-mail:</label>
        <input type="email" id="email" required>

        <label>Tratamento:</label>

        <select id="tratamento" required>
            <option value="">Selecione</option>
            <option>Hidroterapia</option>
            <option>Cinesioterapia</option>
            <option>Neurofuncional</option>
            <option>Massoterapia</option>
        </select>

        <label>Data:</label>
        <input type="date" id="data" required>

        <label>Horário:</label>
        <input type="time" id="horario" required>

        <button type="submit">Agendar consulta</button>

    </form>

    <div id="mensagem"></div>

</main>

<footer>
    <p>&copy; 2026 LauraTerapia</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
